# Convenience compose file for local development of all four services:
# MongoDB, the Node/Express backend, the Python/Flask ML microservice, and
# the React frontend (served via nginx once built).
#
# Usage:
#   docker compose up --build
#
# Backend:   http://localhost:5000
# ML service: http://localhost:8001
# Frontend:  http://localhost:8080
version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: sp-ats-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  ml-service:
    build: ./ml-service
    container_name: sp-ats-ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MODEL_NAME=all-MiniLM-L6-v2
      - PORT=8001

  backend:
    build: ./backend
    container_name: sp-ats-backend
    restart: unless-stopped
    depends_on:
      - mongo
      - ml-service
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:8080
      - MONGO_URI=mongodb://mongo:27017/smart_portfolio_ats
      - JWT_SECRET=change_this_to_a_long_random_string
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=change_this_too_another_long_random_string
      - JWT_REFRESH_EXPIRES_IN=30d
      - ML_SERVICE_URL=http://ml-service:8001
      - PORTFOLIO_BASE_URL=http://localhost:5000/p
    volumes:
      - backend-generated:/app/generated

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    container_name: sp-ats-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongo-data:
  backend-generated:
